name: Test and build Cipher APK

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cipher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Cryptography and relay tests
        run: npm test
      - name: Install browser for end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: Browser and two-account encrypted messaging tests
        run: npm run test:e2e
      - name: Build and bundle the shared client
        run: npm run build && npm run android:sync
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and lint the Android debug application
        run: ./gradlew :app:assembleDebug :app:lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: cipher-android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload browser traces if a test failed
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-traces
          path: test-results/
          if-no-files-found: ignore
